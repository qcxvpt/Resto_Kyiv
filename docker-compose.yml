version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      # Persist the SQLite DB between container restarts
      - restokyiv_data:/app/instance
    restart: unless-stopped

volumes:
  restokyiv_data:
