<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RestoKyiv — Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/>
</head>
<body>

<!-- Вибір мови ЗВЕРХУ -->
<div class="lang-bar">
  <span class="lang-label">🌐</span>
  <button class="lang-btn" id="lang-uk" onclick="setLang('uk')">🇺🇦 UA</button>
  <button class="lang-btn" id="lang-en" onclick="setLang('en')">🇬🇧 EN</button>
  <button class="lang-btn" id="lang-ru" onclick="setLang('ru')">🇷🇺 RU</button>
</div>

<header class="top-nav">
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="height:40px;"/>
    <h1>RestoKyiv</h1>
  </div>
  <nav class="nav-container">
    <div class="nav-actions">
      <a href="{{ url_for('main.index') }}" class="btn-nav" id="back-btn">← Карта</a>
    </div>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">🍕 RestoKyiv</div>
    <div class="auth-sub" id="auth-sub">Створіть акаунт для відгуків</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="auth-card">
      <form method="POST" action="{{ url_for('main.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="form-group">
          <label for="username" id="label-username">Ім'я користувача</label>
          <input type="text" id="username" name="username" required
                 minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+"
                 title="Лише букви, цифри, підкреслення" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label for="password" id="label-password">Пароль</label>
          <input type="password" id="password" name="password" required
                 minlength="8" autocomplete="new-password"/>
          <div class="hint" id="hint-password">Мін. 8 символів · 1 велика буква · 1 цифра</div>
        </div>
        <div class="form-group">
          <label for="confirm" id="label-confirm">Підтвердіть пароль</label>
          <input type="password" id="confirm" name="confirm" required
                 minlength="8" autocomplete="new-password"/>
        </div>
        <button type="submit" class="btn-full" id="submit-btn">Зареєструватись</button>
      </form>
    </div>

    <div class="auth-footer">
      <span id="footer-text">Вже є акаунт?</span>
      <a href="{{ url_for('main.login') }}" id="footer-link">Увійти</a>
    </div>
  </div>
</div>

<script>
const T = {
  uk: { sub:'Створіть акаунт для відгуків', username:"Ім'я користувача",
        password:'Пароль', hint:'Мін. 8 символів · 1 велика буква · 1 цифра',
        confirm:'Підтвердіть пароль', submit:'Зареєструватись',
        back:'← Карта', footerText:'Вже є акаунт?', footerLink:'Увійти' },
  en: { sub:'Create an account to leave reviews', username:'Username',
        password:'Password', hint:'Min 8 chars · 1 uppercase letter · 1 digit',
        confirm:'Confirm password', submit:'Register',
        back:'← Map', footerText:'Already have an account?', footerLink:'Log in' },
  ru: { sub:'Создайте аккаунт для отзывов', username:'Имя пользователя',
        password:'Пароль', hint:'Мин. 8 символов · 1 заглавная буква · 1 цифра',
        confirm:'Подтвердите пароль', submit:'Зарегистрироваться',
        back:'← Карта', footerText:'Уже есть аккаунт?', footerLink:'Войти' },
};

function setLang(lang) {
  localStorage.setItem('lang', lang);
  const t = T[lang] || T.uk;
  ['uk','en','ru'].forEach(l => document.getElementById('lang-'+l)?.classList.toggle('active', l===lang));
  document.getElementById('auth-sub').textContent        = t.sub;
  document.getElementById('label-username').textContent  = t.username;
  document.getElementById('label-password').textContent  = t.password;
  document.getElementById('hint-password').textContent   = t.hint;
  document.getElementById('label-confirm').textContent   = t.confirm;
  document.getElementById('submit-btn').textContent      = t.submit;
  document.getElementById('back-btn').textContent        = t.back;
  document.getElementById('footer-text').textContent     = t.footerText;
  document.getElementById('footer-link').textContent     = t.footerLink;
}

const saved = localStorage.getItem('lang') || 'uk';
setLang(saved);
</script>
</body>
</html>
