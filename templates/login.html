<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RestoKyiv — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/>
</head>
<body>

<!-- Вибір мови ЗВЕРХУ -->
<div class="lang-bar">
  <span class="lang-label">🌐</span>
  <button class="lang-btn" id="lang-uk" onclick="setLang('uk')">🇺🇦 UA</button>
  <button class="lang-btn" id="lang-en" onclick="setLang('en')">🇬🇧 EN</button>
  <button class="lang-btn" id="lang-ru" onclick="setLang('ru')">🇷🇺 RU</button>
</div>

<header class="top-nav">
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="height:40px;"/>
    <h1>RestoKyiv</h1>
  </div>
  <nav class="nav-container">
    <div class="nav-actions">
      <a href="{{ url_for('main.index') }}" class="btn-nav" id="back-btn">← Карта</a>
    </div>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">🍕 RestoKyiv</div>
    <div class="auth-sub" id="auth-sub">Увійдіть, щоб залишати відгуки</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="auth-card">
      <form method="POST" action="{{ url_for('main.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="form-group">
          <label for="username" id="label-username">Ім'я користувача</label>
          <input type="text" id="username" name="username" required maxlength="32" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label for="password" id="label-password">Пароль</label>
          <input type="password" id="password" name="password" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn-full" id="submit-btn">Увійти</button>
      </form>
    </div>

    <div class="auth-footer">
      <span id="footer-text">Немає акаунту?</span>
      <a href="{{ url_for('main.register') }}" id="footer-link">Зареєструватись</a>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1.25rem;">
      <span class="sec-tag">bcrypt</span>
      <span class="sec-tag">CSRF</span>
      <span class="sec-tag">rate limiting</span>
      <span class="sec-tag">secure headers</span>
    </div>
  </div>
</div>

<script>
const T = {
  uk: { sub:'Увійдіть, щоб залишати відгуки', username:"Ім'я користувача", password:'Пароль',
        submit:'Увійти', back:'← Карта', footerText:'Немає акаунту?', footerLink:'Зареєструватись' },
  en: { sub:'Log in to leave reviews', username:'Username', password:'Password',
        submit:'Log in', back:'← Map', footerText:"Don't have an account?", footerLink:'Register' },
  ru: { sub:'Войдите, чтобы оставлять отзывы', username:'Имя пользователя', password:'Пароль',
        submit:'Войти', back:'← Карта', footerText:'Нет аккаунта?', footerLink:'Зарегистрироваться' },
};

function setLang(lang) {
  localStorage.setItem('lang', lang);
  const t = T[lang] || T.uk;
  ['uk','en','ru'].forEach(l => document.getElementById('lang-'+l)?.classList.toggle('active', l===lang));
  document.getElementById('auth-sub').textContent      = t.sub;
  document.getElementById('label-username').textContent= t.username;
  document.getElementById('label-password').textContent= t.password;
  document.getElementById('submit-btn').textContent    = t.submit;
  document.getElementById('back-btn').textContent      = t.back;
  document.getElementById('footer-text').textContent   = t.footerText;
  document.getElementById('footer-link').textContent   = t.footerLink;
}

const saved = localStorage.getItem('lang') || 'uk';
setLang(saved);
</script>
</body>
</html>
